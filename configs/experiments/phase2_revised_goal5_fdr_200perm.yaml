extends: configs/experiments/phase2_revised_goal5_formal_fdr.yaml
experiment_id: phase2_revised_goal5_fdr_200perm

objective: stronger FDR/calibration smoke with 200 permutations for the fixed CCC nulls
output_dir: outputs/phase2_revised/goal5_fdr_200perm

default_panel:
  dataset: tonsil_real_background_smoke
  replicate: human_tonsil_slide_tags_replicate_00
  method: spatialself_wavelet_edge_prior
  candidate_path: outputs/phase2_revised/goal4_real_background_v2/smoke_tonsil_datasets/human_tonsil_slide_tags_replicate_00/candidate_interactions.csv
  prediction_path: outputs/phase2_revised/goal2_full_baseline_panel/tonsil_real_background_smoke/spatialself_wavelet_edge_prior/human_tonsil_slide_tags_replicate_00__spatialself_wavelet_predictions.csv

null_models:
  - spatial_permutation
  - receiver_permutation
  - lr_identity_permutation

fdr:
  n_permutations: 200
  random_seed: 2026
  alpha: 0.05
  score_column: score
  direct_group_top_fraction: 0.1

claim_level: stronger_fdr_200perm_smoke_not_manuscript_ready

interpretation_guardrail: >
  This panel increases p-value resolution from 20 to 200 permutations on one
  tonsil real-background smoke dataset. It improves calibration evidence but
  is still not a final 500-permutation manuscript panel.
