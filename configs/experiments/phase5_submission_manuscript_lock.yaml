claim_policy:
  allowed_core_claim: SpatialSelf supports a calibrated weak-signal and false-positive tradeoff in realistic benchmark settings, with graph-wavelet/LR-identity ablation, permutation/FDR, and key lymph-node downstream evidence.
  disallowed_global_claims:
    - SpatialSelf is best on every metric, dataset, tissue, and baseline.
    - SpatialSelf proves weak communication superiority in all real tissues.
    - SpatialSelf has many edge-level FDR discoveries in the current key panel.
    - Unlabeled real ST data provide complete ground truth.

required_real_validation_datasets:
  - lymph_node
  - tonsil
  - melanoma

required_main_figures:
  - fig1_method_overview
  - fig2_controlled_benchmark
  - fig3_real_background_benchmark
  - fig4_baseline_comparison
  - fig5_ablation_weak_signal
  - fig6_fdr
  - fig7_lymph_node_validation
  - fig8_tonsil_or_melanoma_validation

retained_baselines:
  - commot
  - cellchat
  - spatalk
  - cellnest

excluded_baselines:
  - lr_coexp
