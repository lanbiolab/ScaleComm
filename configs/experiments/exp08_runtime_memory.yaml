extends: configs/experiments/phase1_common.yaml
experiment_id: exp08_runtime_memory

objective: runtime and memory scaling benchmark
output_dir: outputs/phase1/exp08_runtime_memory

scales:
  smoke_cell_or_spot_counts:
    - 120
    - 240
  cell_or_spot_counts:
    - 1000
    - 5000
    - 10000
    - 50000
    - 100000
  lr_pair_counts:
    - 50
    - 100
    - 500
    - 1000

methods:
  - spatialself
  - spatialself_wavelet
  - commot
  - cellchat
  - cellnest
  - deeptalk
  - niches

metrics:
  - wall_clock_time
  - peak_cpu_memory
  - peak_gpu_memory
  - number_of_candidate_edges
  - number_of_lr_pairs
  - runtime_per_epoch
  - total_runtime
  - method_status
  - failure_reason

implementation:
  profiler: scripts/benchmark/profile_runtime_memory.py
  scaling_runner: scripts/benchmark/run_runtime_scaling.py
  spatialself_default:
    pseudo_label_strategy: lr_prior_lr_capped_mechanism_niche_expression_distance
    ranking_loss_weight: 0.35
    ranking_margin: 0.5
    weak_positive_fraction: 0.0
  current_runnable_adapters:
    - spatialself_wavelet
    - spatialself_wavelet_edge_prior
    - spatialself_gat
    - commot
    - cellchat
    - cellnest
    - deeptalk
  pending_model_or_external_adapters:
    - spatialself
    - niches
    - nichenet
  current_full_evidence:
    controlled_medium_scaling: outputs/phase1/exp08_runtime_memory/controlled_medium_scaling/runtime_memory_scaling.csv
    scales:
      - 500
      - 1000
    methods:
      - spatialself_wavelet
      - spatialself_wavelet_edge_prior
      - spatialself_gat
      - commot
    max_candidate_edges: 926654
  current_sparse_evidence:
