experiment_id: reference_scdesign3_range_context_panel
output_dir: outputs/reference_based_benchmark/panel_scdesign3_range_context

objective: >
  Evaluate the graph-free LR-specific range/context-gated SpatialSelf variant on
  the locked scDesign3 reference benchmark panel.

datasets:
  - dataset_id: lymph_scdesign3
    tissue: lymph_node
    dataset_root: outputs/reference_based_benchmark/smoke_scdesign3
    replicate_dir: outputs/reference_based_benchmark/smoke_scdesign3/reference_lymph_node_scdesign3_replicate_00
  - dataset_id: melanoma_scdesign3
    tissue: melanoma
    dataset_root: outputs/reference_based_benchmark/smoke_scdesign3_melanoma
    replicate_dir: outputs/reference_based_benchmark/smoke_scdesign3_melanoma/reference_melanoma_scdesign3_replicate_00

methods:
  metric_panel:
    - spatialself_range_context
    - commot

spatialself_reference_baseline:
  display_name: spatialself_range_context_candidate
  model_name: spatialself_range_context
  epochs: 30
  k_nn: 12
  max_train_samples: 12000
  pseudo_label_strategy: expression_distance
  ranking_loss_weight: 0.0
  ranking_margin: 1.0
  feasibility_loss_weight: 0.0
  hard_negative_loss_weight: 0.05
  context_contrastive_loss_weight: 0.0
  context_contrastive_margin: 0.5
  context_contrastive_negative_mode: random_receiver
  null_candidate_loss_weight: 0.0
  mechanism_guard_loss_weight: 0.2
  lr_cap_positive: 50
  lr_cap_negative: 200
  no_lr_embedding: false
  no_distance: false
  no_spatial_graph: false
  no_expression_features: false

commot:
  cot_nitermax: 500

range_evaluation:
  top_k: 100
  threshold_quantile: 0.95

claim_scope: >
  This panel tests a new graph-free SpatialSelf mainline where LR identity
  controls both a distance-range basis gate and a local context gate. It is a
  candidate architecture, not yet the locked retained baseline.

limitations:
  - The candidate is currently validated only on the scDesign3 smoke reference panel.
  - Lymph node improves strongly; melanoma improves more modestly and still shows elevated FDR.
  - Weak-signal recall remains limited in the current smoke setting.
