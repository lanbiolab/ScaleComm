[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scalecomm"
version = "0.1.3"
description = "Scale-aware spatial cell-cell communication inference"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.0",
  "torch-geometric>=2.4",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scalecomm*"]
